[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zen-egress-pool"
version = "0.2.0"
description = "Egress-pool provider: multiplexed SOCKS5 exits from subscription profiles + external proxy lists, probed fastest-first for cliproxy-rotator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.14.3",
    "aiohttp-socks>=0.12.0",
]

[project.scripts]
zen-egress-pool = "zen_proxy.egress_pool:main"

[tool.hatch.build.targets.wheel]
packages = ["src/zen_proxy"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "mypy>=1.10.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ANN", "PLC", "RET", "SLF", "PLW", "TRY", "EM", "PERF"]
ignore = [
    "E501",
    "SIM105",
    "ANN101",
    "ANN102",
    "PLW2901",
    "TRY003",
    "EM101",
    "EM102",
    "PERF401",
    "TRY400",
    "TRY300",
    "SLF001",
    "PLW0603",
]

[tool.mypy]
strict = true
python_version = "3.11"
warn_unused_ignores = true
show_error_codes = true
